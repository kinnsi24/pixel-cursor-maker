
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="オリジナルのドット絵マウスカーソルを作成できるWebサイトです。">
  <title>Pixel Cursor Maker</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1>Pixel Cursor Maker</h1>
      <p>自分だけのドット絵カーソルを作ろう。</p>
    </div>
  </header>

  <main class="main">
    <section class="intro">
      <h2>カーソルエディター</h2>
      <p>好きな色を使って、オリジナルのマウスカーソルを作成できます。</p>
    </section>

    <section class="editor">
      <aside class="panel tools-panel">
        <h3>ツール</h3>
        <div class="tool-buttons">
          <button class="tool-button active" id="penTool">ペン</button>
          <button class="tool-button" id="eraserTool">消しゴム</button>
          <button class="tool-button" id="fillTool">塗りつぶし</button>
        </div>

        <h3>カラー</h3>
        <input type="color" id="colorPicker" value="#2563eb">
        <div class="palette" id="palette">
          <button style="background:#172033" data-color="#172033" aria-label="黒"></button>
          <button style="background:#ffffff" data-color="#ffffff" aria-label="白"></button>
          <button style="background:#ef4444" data-color="#ef4444" aria-label="赤"></button>
          <button style="background:#f59e0b" data-color="#f59e0b" aria-label="オレンジ"></button>
          <button style="background:#22c55e" data-color="#22c55e" aria-label="緑"></button>
          <button style="background:#2563eb" data-color="#2563eb" aria-label="青"></button>
          <button style="background:#a855f7" data-color="#a855f7" aria-label="紫"></button>
          <button style="background:#ec4899" data-color="#ec4899" aria-label="ピンク"></button>
        </div>
      </aside>

      <section class="panel canvas-panel">
        <h3>キャンバス</h3>

<div class="canvas-coordinate-area">
  <div class="x-axis">
    <span>0</span>
    <span>8</span>
    <span>16</span>
    <span>24</span>
    <span>31</span>
  </div>

  <div class="canvas-main-area">
    <div class="y-axis">
      <span>0</span>
      <span>8</span>
      <span>16</span>
      <span>24</span>
      <span>31</span>
    </div>

    <div class="canvas-stage">
  <canvas id="pixelCanvas" width="320" height="320"></canvas>
  <canvas
    id="hotspotOverlay"
    class="hotspot-overlay"
    width="320"
    height="320"
  ></canvas>
</div>
  </div>
</div>
        <div class="canvas-actions">
          <button id="undoButton">元に戻す</button>
          <button id="redoButton">やり直す</button>
          <button id="clearButton">全消去</button>
        </div>
      </section>

      <aside class="panel preview-panel">
        <h3>プレビュー</h3>
        <div class="preview-area">
          <canvas id="previewCanvas" width="128" height="128"></canvas>
        </div>

        <h3>カーソル設定</h3>
        <label for="hotspotX">ホットスポット X</label>
        <input type="number" id="hotspotX" min="0" max="31" value="0">

        <label for="hotspotY">ホットスポット Y</label>
        <input type="number" id="hotspotY" min="0" max="31" value="0">

        <h3>ダウンロード</h3>
        <button class="download-button" id="pngButton">PNGで保存</button>
        <button class="download-button" id="curButton">CURで保存</button>
      </aside>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Pixel Cursor Maker</p>
  </footer>

  <script src="../js/script.js"></script>
</body>
</html>
